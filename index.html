:root{--paper:#F3EFE7;--rule:#D8D0C2;--ink:#1B1917;--ink3:#6B645B;--walnut:#5A3A2A;--gold:#B98A2E}
*{box-sizing:border-box}html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Newsreader,Georgia,serif;font-size:20px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header{padding:28px 0 0}

.mark{width:28px;height:28px;position:relative}.mark i{position:absolute;width:6px;height:6px;border-radius:50%}

.mark:before{content:"";position:absolute;inset:3px;border:1px solid var(--rule);border-radius:50%}
h1{font-family:Fraunces,serif;font-weight:400;font-size:clamp(38px,7vw,60px);line-height:1.05;letter-spacing:-.015em;margin:96px 0 40px}
ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--rule)}
li{border-bottom:1px solid var(--rule)}
li a{display:block;padding:26px 0;text-decoration:none;color:var(--ink)}
li a:hover .t{color:var(--walnut)}
.t{font-family:Fraunces,serif;font-weight:600;font-size:clamp(24px,3.4vw,30px);line-height:1.15;margin:0 0 6px}
.d{color:var(--ink3);margin:0;font-size:19px}
footer{margin:72px 0 48px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink3)}
footer a{color:var(--ink3);text-decoration:none}
